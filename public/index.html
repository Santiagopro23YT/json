<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#ffffff">
    <title>Inicio | Sistema de gestión académica</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <script type="module" src="./app.js"></script>
</head>
<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <div class="app-shell">
        <aside id="menu-lateral" class="sidebar">
            <a class="brand" href="#inicio">
                <img src="./assets/img/logo_sena.png" alt="SENA" width="46" height="46">

            <nav aria-label="Menú principal" id="navegacion"></nav>

                </button>
                <span id="seccion-actual" class="section-name">Inicio</span>
                <span class="user-icon"><img src="./assets/icons/user-round.png" alt="" width="20" height="20"></span>

            <main id="contenido" tabindex="-1"></main>

</html>
